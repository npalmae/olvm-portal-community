<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">OvP favicon</title>
  <desc id="desc">OLVM-PORTAL multitenant portal mark with connected tenant nodes</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="15" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <path d="M16 18.5 28 11l12 7.5M28 11v9M40 18.5 51 25v14L40 46.5 28 53l-12-7.5V32" fill="none" stroke="url(#accent)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <g fill="#a7f3d0" stroke="#0f172a" stroke-width="1.5">
    <circle cx="16" cy="18.5" r="3.2"/>
    <circle cx="40" cy="18.5" r="3.2"/>
    <circle cx="16" cy="45.5" r="3.2"/>
    <circle cx="40" cy="46.5" r="3.2"/>
  </g>
  <g filter="url(#shadow)" fill="#f8fafc" font-family="Inter, SF Pro Display, -apple-system, sans-serif" font-size="25" font-weight="800" letter-spacing="-2">
    <text x="20" y="40">OvP</text>
  </g>
  <circle cx="51" cy="25" r="3.2" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="51" cy="39" r="3.2" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5"/>
</svg>
