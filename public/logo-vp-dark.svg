<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Virtual Portal — logo completo (fondo oscuro)</title>
  <desc id="d">Marca de marcos superpuestos + wordmark VIRTUAL PORTAL claro</desc>
  <defs>
    <linearGradient id="fa" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <rect x="30" y="30" width="240" height="380" rx="46" fill="none" stroke="url(#fa)" stroke-width="32" opacity="0.95"/>
  <rect x="170" y="60" width="248" height="378" rx="46" fill="none" stroke="url(#fb)" stroke-width="32" opacity="0.88"/>
  <g fill="#ede9fe" font-family="Nunito, 'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="800" letter-spacing="6">
    <text x="500" y="220" font-size="150">VIRTUAL</text>
    <text x="500" y="390" font-size="150">PORTAL</text>
  </g>
</svg>
